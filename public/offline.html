<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#059669">
    <title>VServiceRDC — Hors ligne</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; color: #17231e; background: #f5faf7; font: 1rem/1.6 system-ui, sans-serif; }
      main { width: min(100%, 32rem); padding: clamp(1.5rem, 6vw, 3rem); border: 1px solid #dce9e0; border-radius: 1rem; background: white; }
      h1 { margin: 0 0 .75rem; color: #087443; font-size: clamp(1.5rem, 6vw, 2rem); }
      p { margin: 0 0 1rem; overflow-wrap: anywhere; }
      button { min-height: 48px; max-width: 100%; padding: .75rem 1rem; border: 0; border-radius: .5rem; color: white; background: #087443; font: inherit; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Vous êtes hors ligne</h1>
      <p>Les pages déjà consultées restent disponibles. Reconnectez-vous pour charger de nouveaux profils ou envoyer vos modifications.</p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
